name: Publish new version

on:
  push:
    tags:
      - v*

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        registry-url: 'https://registry.npmjs.org'
    - run: npm install
    - run: npm run prepare-release
    - run: npm publish
