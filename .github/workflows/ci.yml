name: CI Test

on:
  push:
    branches:
      - master
  schedule:
    # https://crontab.guru/#0_10_*_*_0
    - cron:  '0 10 * * 0'
  pull_request:

jobs:
  lint:
    name: Lint files
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 24
    - run: npm install
    - run: npm run lint

  ts-min:
    name: Minimal TS
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 24
    - run: npm install
    - run: npm install typescript@5.4.2
    - run: npm run tsc
    - run: npm run test

  ts-current:
    name: Current TS
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 24
    - run: npm install
    - run: npm run tsc
    - run: npm run test
    - run: npm run bundle-dts

  ts-latest:
    name: Latest supported TS (6.x)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 24
    - run: npm install
    - run: npm install typescript@6
    - run: npm run tsc
    - run: npm run test
    - run: npm run bundle-dts
